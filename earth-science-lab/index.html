<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eff9f8">
  <meta name="description" content="소원쌤의 지구과학 탐험실. 지층 탐험, 기상 방탈출, 해양 RPG를 한곳에서 만나보세요.">
  <title>소원쌤의 지구과학 탐험실</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%232d857b'/%3E%3Ccircle cx='32' cy='32' r='20' fill='%23e4f5f0'/%3E%3Cellipse cx='32' cy='32' rx='9' ry='20' fill='none' stroke='%232d857b' stroke-width='3'/%3E%3Cpath d='M12 32h40M16 22h32M16 42h32' stroke='%232d857b' stroke-width='3'/%3E%3C/svg%3E">
  <style>
    @font-face{font-family:Jua;src:url('fonts/Jua.woff') format('woff');font-weight:400;font-style:normal;font-display:swap}
    @font-face{font-family:NotoSansKR;src:url('fonts/NotoSansKR.woff') format('woff');font-weight:100 900;font-style:normal;font-display:swap}
    :root{--ink:#203f43;--muted:#546d70;--green:#25776e;--border:#dde9e7;--background:#f5faf9;--round:22px}
    *{box-sizing:border-box}[hidden]{display:none!important}
    body{margin:0;background:var(--background);color:var(--ink);font-family:NotoSansKR,system-ui,-apple-system,'Malgun Gothic',sans-serif;font-size:16px;line-height:1.65;word-break:keep-all}
    button,input,a{-webkit-tap-highlight-color:transparent}
    button,input{font:inherit}button,a{touch-action:manipulation}
    a{color:inherit}button{cursor:pointer}
    :focus-visible{outline:3px solid #11776d;outline-offset:4px}
    .skip{position:fixed;top:12px;left:12px;z-index:10;background:white;padding:12px 18px;transform:translateY(-180%)}.skip:focus{transform:none}
    .shell{width:min(1120px,calc(100% - 64px));margin:auto}
    header{background:#fff;border-bottom:1px solid var(--border)}
    .header-inner{min-height:96px;display:flex;align-items:center;justify-content:space-between;gap:30px}
    .brand{display:flex;align-items:center;gap:13px;text-decoration:none;flex-shrink:0}
    .brand-mark{width:44px;height:44px;border-radius:15px;background:#e5f5ee;display:grid;place-items:center;color:var(--green)}
    .brand-mark svg{width:30px;height:30px}.brand small{display:block;color:var(--muted);font-size:13px;line-height:1.35;margin-bottom:2px}
    .brand-title{font-family:Jua,sans-serif;font-size:25px;line-height:1.2;letter-spacing:.01em}
    .search{width:260px;position:relative}.search svg{position:absolute;left:15px;top:15px;width:19px;height:19px;color:var(--muted);pointer-events:none}
    .search input{width:100%;min-height:48px;border:1px solid var(--border);border-radius:14px;background:#f6faf9;padding:10px 14px 10px 43px;color:var(--ink);font-size:14px;appearance:none}.search input::placeholder{color:#617a7d}
    main{padding-top:32px}
    .featured{position:relative;display:grid;grid-template-columns:1fr 1.1fr;overflow:hidden;border-radius:var(--round);background:#e5f5ef;border:1px solid #d5e9e1;min-height:265px}
    .feature-copy{padding:32px 36px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center}
    .eyebrow{font-size:14px;font-weight:700;color:#356c60;display:inline-flex;align-items:center;gap:7px;margin:0 0 10px}.eyebrow svg{width:18px;height:18px}
    h1,h2,h3,p{margin-top:0}h1,h2,h3{font-family:Jua,sans-serif;font-weight:400;line-height:1.3}
    h1{font-size:36px;margin-bottom:9px}.feature-description{color:#405e5b;margin-bottom:17px;font-size:16px}
    .feature-meta{display:flex;align-items:center;gap:13px;color:#466964;font-size:14px;margin-bottom:19px}.meta-item{display:inline-flex;align-items:center;gap:5px}.meta-item svg{width:16px;height:16px}
    .feature-image{position:absolute;top:0;right:0;width:52.38%;height:100%;min-height:0;object-fit:cover;display:block}
    .start{display:inline-flex;justify-content:center;align-items:center;min-height:46px;padding:9px 23px;border-radius:12px;text-decoration:none;background:var(--green);color:white;font-weight:650;font-size:15px;transition:background .15s,transform .15s;border:0}
    .start:hover{background:#1a6058}.start:active{transform:translateY(1px)}
    .catalog{margin-top:34px}.catalog-bar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:19px}
    h2{font-size:25px;margin:0}.filters{display:flex;gap:6px;flex-wrap:wrap}.filter{min-height:43px;border:1px solid transparent;border-radius:12px;padding:7px 16px;background:transparent;color:var(--muted);font-size:15px;font-weight:600}.filter:hover{background:#e8f2ef}.filter[aria-pressed="true"]{color:#1f665e;background:#e0f1eb;border-color:#cde5dc}
    .cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
    .card{background:#fff;border:1px solid var(--border);border-radius:var(--round);overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .18s,transform .18s}
    .card:hover{box-shadow:0 8px 24px #294c4610;transform:translateY(-3px)}
    .card-image{display:block;width:100%;aspect-ratio:1.7;height:auto;object-fit:cover;background:#eaf4f1}
    .card-copy{padding:21px 23px 23px;display:flex;flex-direction:column;flex-grow:1}.tags{display:flex;gap:7px;margin-bottom:11px;align-items:center}.tag{display:inline-block;font-size:13px;line-height:1.4;padding:4px 9px;border-radius:7px;background:#e7f4ed;color:#336d52;font-weight:600}.tag[data-subject="대기·해양"]{background:#e7f2fc;color:#37658b}.kind{font-size:13px;color:var(--muted)}
    h3{font-size:25px;margin-bottom:7px}.card-description{font-size:15px;line-height:1.6;color:var(--muted);margin-bottom:18px;flex-grow:1}
    .card-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px}.duration{font-size:14px;color:var(--muted);display:inline-flex;align-items:center;gap:5px}.duration svg{width:17px;height:17px;flex-shrink:0}.card .start{padding:8px 21px;min-height:44px;background:#edf5f2;color:#24675d}.card .start:hover{background:#dceee7}
    .pending{display:inline-flex;justify-content:center;align-items:center;min-height:44px;padding:8px 21px;background:#f2f5f5;border-radius:12px;color:#677b7d;font-size:14px}
    .empty{text-align:center;border:1px dashed #cddeda;border-radius:20px;padding:40px 20px;color:var(--muted);background:#fff;margin:0}.empty[hidden]{display:none}
    footer{margin-top:40px;padding:23px 0 30px;color:#687e80;font-size:13px;text-align:center}footer p{margin:0}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(min-width:1300px){main{padding-top:38px}.featured{min-height:285px}.feature-image{min-height:0}}
    @media(max-width:900px){.shell{width:calc(100% - 40px)}.header-inner{min-height:88px}.brand-title{font-size:23px}.search{width:220px}.feature-copy{padding:25px}.featured{grid-template-columns:1fr 1fr}.feature-image{width:50%}h1{font-size:32px}.cards{gap:16px}.card-copy{padding:18px}.card-bottom{flex-wrap:wrap}.card-description{font-size:14px}h3{font-size:23px}.catalog-bar{align-items:flex-start}}
    @media(max-width:700px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.catalog-bar{flex-direction:column;gap:12px}.featured{grid-template-columns:1fr 1fr}.feature-copy{padding:24px}.feature-description{font-size:15px}.feature-meta{gap:8px;flex-wrap:wrap}.feature-image{min-height:0;width:50%}.header-inner{gap:16px}.search{width:190px}.brand-mark{display:none}}
    @media(max-width:520px){.shell{width:calc(100% - 32px)}.header-inner{padding:19px 0 16px;flex-wrap:wrap;gap:16px}.brand-mark{display:grid;width:40px;height:40px}.brand-title{font-size:24px}.brand small{font-size:12px}.search{width:100%}.search input{min-height:46px}.search svg{top:14px}main{padding-top:22px}.featured{grid-template-columns:1fr}.feature-copy{padding:24px}.feature-image{position:static;width:100%;min-height:0;height:175px;object-position:center 53%;order:-1}h1{font-size:32px}.feature-description{margin-bottom:13px}.feature-meta{margin-bottom:17px}.catalog{margin-top:28px}.filters{gap:4px}.filter{padding:7px 13px}.cards{grid-template-columns:1fr;gap:20px}.card-image{aspect-ratio:1.85}.card-copy{padding:21px 23px 23px}.card-description{font-size:15px}.card-bottom{flex-wrap:nowrap}h3{font-size:26px}footer{margin-top:28px;padding-bottom:25px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;scroll-behavior:auto!important}.card:hover{transform:none}}
  </style>
</head>
<body>
  <a class="skip" href="#catalog">활동 목록으로 이동</a>
  <header>
    <div class="shell header-inner">
      <a class="brand" href="./index.html" aria-label="지구과학 탐험실 홈">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="16" cy="16" r="12"/><ellipse cx="16" cy="16" rx="5" ry="12"/><path d="M4 16h24M6 10h20M6 22h20"/></svg></span>
        <span><small>소원쌤의</small><span class="brand-title">지구과학 탐험실</span></span>
      </a>
      <label class="search"><span class="sr-only">활동 이름 또는 학습 주제 검색</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><input id="search" type="search" placeholder="어떤 활동을 찾나요?" autocomplete="off"></label>
    </div>
  </header>
  <main class="shell">
    <section class="featured" aria-labelledby="feature-title">
      <div class="feature-copy">
        <p class="eyebrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m12 3 2.8 5.6 6.2.9-4.5 4.4 1.1 6.1-5.6-2.9-5.6 2.9 1.1-6.1L3 9.5l6.2-.9z"/></svg>오늘의 탐험</p>
        <h1 id="feature-title"></h1>
        <p class="feature-description" id="feature-description"></p>
        <div class="feature-meta"><span id="feature-topic"></span><span class="meta-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span id="feature-time"></span></span></div>
        <a class="start" id="feature-start">탐험 시작</a>
      </div>
      <img class="feature-image" id="feature-image" alt="" fetchpriority="high">
    </section>
    <section class="catalog" id="catalog" aria-labelledby="catalog-title">
      <div class="catalog-bar">
        <h2 id="catalog-title">전체 활동</h2>
        <div class="filters" role="group" aria-label="학습 분야">
          <button class="filter" type="button" data-category="전체" aria-pressed="true">전체</button>
          <button class="filter" type="button" data-category="대기·해양" aria-pressed="false">대기·해양</button>
          <button class="filter" type="button" data-category="지질" aria-pressed="false">지질</button>
          <button class="filter" type="button" data-category="천문" aria-pressed="false">천문</button>
        </div>
      </div>
      <div class="cards" id="cards"></div>
      <p class="empty" id="empty" hidden></p>
      <p class="sr-only" id="results" role="status" aria-live="polite"></p>
    </section>
    <noscript><p>활동 목록을 보려면 브라우저의 JavaScript를 켜주세요. <a href="apps/geo-note/index.html">지층 탐험대 열기</a></p></noscript>
  </main>
  <footer class="shell"><p>소원쌤의 지구과학 수업</p></footer>
  <template id="card-template">
    <article class="card">
      <img class="card-image" alt="" loading="lazy" width="640" height="400">
      <div class="card-copy">
        <div class="tags"><span class="tag"></span><span class="kind"></span></div>
        <h3></h3><p class="card-description"></p>
        <div class="card-bottom"><span class="duration"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span></span></span><span class="action"></span></div>
      </div>
    </article>
  </template>
  <script>
    /* ================================================================
       새 웹앱을 추가할 때는 아래 APPS 목록에 항목 하나를 추가하세요.
       id: 중복 없는 영문 이름 / category: 대기·해양, 지질, 천문 중 하나
       image: 카드 이미지 경로 / href: 앱 파일 경로 또는 이미 배포한 URL
       ready: 앱 파일을 해당 폴더에 넣은 뒤 true로 바꾸면 버튼이 나타납니다.
       카드 순서는 이 목록의 순서와 같습니다.
       ================================================================ */
    const APPS = [
      { id: 'geo-note', title: '지층 탐험대', category: '지질', kind: '시뮬레이션',
        topic: '지사학 법칙', description: '지층의 단서로 지구의 과거를 추리해요.',
        minutes: 30, image: 'images/geology.webp', href: 'apps/geo-note/index.html', ready: true },
      { id: 'weather-escape', title: '기상 관측소 방탈출', category: '대기·해양', kind: '방탈출',
        topic: '날씨의 변화 · 태풍과 악기상', description: '날씨와 태풍의 단서를 찾아 관측소를 복구해요.',
        minutes: 30, image: 'images/weather.webp', href: 'apps/weather-escape/index.html', ready: false },
      { id: 'marea', title: '마레아 탐험', category: '대기·해양', kind: 'RPG',
        topic: '해수의 성질 · 해수의 순환', description: '바다를 탐험하며 해수의 성질과 순환을 알아봐요.',
        minutes: 30, image: 'images/marea.webp', href: 'apps/marea/index.html', ready: false }
    ];
    // 오늘의 탐험에 보여줄 앱 id를 지정합니다. ready가 true인 앱을 고르세요.
    const FEATURED_ID = 'geo-note';

    const $ = id => document.getElementById(id);
    let category = '전체';
    function validHref(value) {
      try { return ['file:', 'http:', 'https:'].includes(new URL(value, location.href).protocol); }
      catch { return false; }
    }
    const featured = APPS.find(app => app.id === FEATURED_ID && app.ready && validHref(app.href))
      || APPS.find(app => app.ready && validHref(app.href));
    if (featured) {
      $('feature-title').textContent = featured.title;
      $('feature-description').textContent = featured.description;
      $('feature-topic').textContent = featured.topic;
      $('feature-time').textContent = `약 ${featured.minutes}분`;
      $('feature-image').src = featured.image;
      $('feature-start').href = featured.href;
      $('feature-start').setAttribute('aria-label', `${featured.title} 탐험 시작`);
    } else { document.querySelector('.featured').hidden = true; }
    function render() {
      const query = $('search').value.trim().toLocaleLowerCase();
      const filtered = APPS.filter(app => (category === '전체' || app.category === category)
        && [app.title, app.topic, app.category, app.kind].join(' ').toLocaleLowerCase().includes(query));
      $('cards').replaceChildren();
      filtered.forEach(app => {
        const card = $('card-template').content.cloneNode(true);
        card.querySelector('img').src = app.image;
        const tag = card.querySelector('.tag'); tag.textContent = app.category; tag.dataset.subject = app.category;
        card.querySelector('.kind').textContent = app.kind;
        card.querySelector('h3').textContent = app.title;
        card.querySelector('.card-description').textContent = app.topic;
        card.querySelector('.duration span').textContent = `약 ${app.minutes}분`;
        if (app.ready && validHref(app.href)) {
          const link = document.createElement('a'); link.className = 'start'; link.href = app.href;
          link.textContent = '시작하기'; link.setAttribute('aria-label', `${app.title} 시작하기`);
          card.querySelector('.action').append(link);
        } else {
          const label = document.createElement('span'); label.className = 'pending'; label.textContent = '준비 중';
          card.querySelector('.action').append(label);
        }
        $('cards').append(card);
      });
      $('empty').hidden = filtered.length !== 0;
      $('empty').textContent = query ? '찾는 활동이 없어요. 다른 이름이나 주제로 검색해보세요.' : `${category} 활동은 준비 중이에요.`;
      $('results').textContent = `${filtered.length}개의 활동`;
      $('catalog-title').textContent = category === '전체' ? '전체 활동' : `${category} 활동`;
    }
    document.querySelectorAll('.filter').forEach(button => button.addEventListener('click', () => {
      category = button.dataset.category;
      document.querySelectorAll('.filter').forEach(item => item.setAttribute('aria-pressed', String(item === button)));
      render();
    }));
    $('search').addEventListener('input', render);
    render();
  </script>
</body>
</html>
